    usage: "<yellow>Usage: /nekoyume language <auto|zh_cn|zh_tw|en_us|ja_jp></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 Plugin language set to </gradient>{0}!"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 Plugin language will now follow your Minecraft language.</gradient>"
    unknown: "<red>❌ Unknown language: {0}</red>"
  achievements:
    disabled: "<red>🏆 The achievement system is disabled.</red>"

