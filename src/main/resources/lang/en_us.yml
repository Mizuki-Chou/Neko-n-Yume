  claim-subtitle: "§7§oWelcome to Neko n' Yume · Cat & Dream"

book:
  title: "§d🐱 Neko n' Yume Beginner's Guide"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 Welcome to Neko n' Yume!\n\n§r§7This is a little world that belongs to you and your cat.\n§7Your cat will always stay by your side."
  page-2: "§l§2🐾 The Basics\n\n§r§7Right-click the cat wand to open the cat panel.\n§7Sneak next to your cat to pet it."
  page-3: "§l§3🍖 Feeding\n\n§r§7Hold food and right-click your cat to feed it.\n§7Feeding restores hunger and affection.\n§7A hungry cat grows thin —\n§7remember to feed it well."
  page-4: "§l§4💖 Affection\n\n§r§7Petting and feeding both raise affection.\n§7Affection affects the aura and gifts.\n§7The first 3 interactions each day are the most effective."
  page-5: "§l§5📈 Growth\n\n§r§7Interactions grant EXP and levels.\n§7Feeding has a chance to grant meow power.\n§7Meow power raises your meow rank and unlocks skill slots,\n§7and in battle your cat will protect you."
  page-6: "§l§6⚔ Battle\n\n§r§7In follow mode your cat attacks\n§7hostile mobs near its owner.\n§7When injured, your cat rests for 90 seconds to recover —\n§7it never dies."
  page-7: "§l§8🏆 Achievements\n\n§r§7Every interaction with your cat\n§7may unlock achievements.\n§7Type /nekoyume achievements\n§7to open the achievement hall."
  page-8: "§l§d🌙 Muma's Night\n\n§r§7It may descend on any night.\n§7During Muma's Night monsters are far stronger,\n§7but slaying them can drop Meow Dans.\n§7🐱 Good luck on your adventures!"

