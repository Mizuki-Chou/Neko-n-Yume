#
# Neko n' Yume language file (English, US)
#
# Chat messages use MiniMessage templates;
# {0} {1} … are argument placeholders (replaced safely after parsing).
# Plain strings (GUI item names / lore / titles) use § color codes.
# Server-side override file: plugins/NekoNYume/lang/en_us.yml
# Hot-reloaded by /nekoyumeadmin reload.

command:
  no-cat: "<red>🐱 You don't have a cat yet!</red>"
  unknown: "<yellow>Usage: /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Neko n' Yume Commands
    </gradient>

    <gray>/nekoyume claim</gray> - Claim your first cat
    <gray>/nekoyume cat</gray> - View your cat
    <gray>/nekoyume rename &lt;name&gt;</gray> - Rename your cat
    <gray>/nekoyume summon</gray> - Summon your cat
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - Set behavior mode
    <gray>/nekoyume gui</gray> - Open the cat panel
    <gray>/nekoyume skill</gray> - Open the skill panel
    <gray>/nekoyume tool</gray> - Get a quick-access cat wand
    <gray>/nekoyume language &lt;auto|zh_cn|zh_tw|en_us|ja_jp&gt;</gray> - Set your language
    <gray>/nekoyume achievements</gray> - View the achievement hall
    <gray>/nekoyume help</gray> - Show this help
  claim:
    already-has: "<red>🐱 You already have a cat!</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 Congratulations! You received your first cat, </gradient>{0}!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} has already come to your side!"
  cat:
    data-error: "<red>🐱 Your cat data is corrupted. Please contact an administrator.</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 Your Cat</gradient>"
    name: "Name: {0}"
    days: "<white>Together: <aqua>Day {0}</aqua>"
    level: "<white>Level: <yellow>{0}</yellow> <gray>(EXP {1}/{2})</gray>"
    meow: "<white>Meow Rank: <light_purple>{0}</light_purple> <gray>(Meow Power {1}/{2})</gray>"
    mood: "<white>Mood: <yellow>{0} {1}</yellow>"
    personality: "<white>Personality: <aqua>{0}</aqua>"
    tier: "<white>Heritage: <aqua>{0}</aqua>"
    behavior: "<white>Behavior: <aqua>{0}</aqua>"
    bond: "<white>Bond: <light_purple>{0}</light_purple> <gray>({1}/100)</gray>"
    combat-bonus: "<white>Combat bonus: <red>{0}%</red></white>"
    equipment: "<white>Equipment: <gold>{0}</gold></white>"
  mode:
    usage: "<yellow>Usage: /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ Unknown mode: {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 Behavior mode changed to </gradient>{0}"
  rename:
    usage: "<yellow>Usage: /nekoyume rename <name></yellow>"
    empty: "<red>❌ The cat's name cannot be empty!</red>"
    too-long: "<red>❌ The name cannot be longer than 16 characters!</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 Your cat is now called </gradient>{0}!"
  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} appeared by your side!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} came to you!"
