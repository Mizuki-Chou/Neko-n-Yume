  wand-name: "§d🐱 猫じゃらし"
  wand-lore: "§7右クリックで猫パネルを開く"
  claim-title: "§d🎉 猫を迎えました！"
  claim-subtitle: "§7§o猫と夢 · Neko n' Yume へようこそ"

#
# ---------- 入門ガイド ----------
#
book:
  title: "§d🐱 猫と夢 入門ガイド"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 猫と夢へようこそ！\n\n§r§7ここはあなたと猫の小さな世界。\n§7この猫はいつもあなたのそばにいます。"
  page-2: "§l§2🐾 基本操作\n\n§r§7猫じゃらしを右クリックすると猫パネルが開きます。\n§7スニークしながら右クリックで猫をなでられます。"
  page-3: "§l§3🍖 ごはん\n\n§r§7食べ物を持って猫を右クリックするとごはんをあげられます。\n§7満腹度と好感度が回復します。\n§7お腹が空くと猫は痩せてしまうので、\n§7こまめにごはんをあげましょう。"
  page-4: "§l§4💖 好感度\n\n§r§7なでることとごはん、どちらでも好感度が上がります。\n§7好感度はオーラとプレゼントに影響します。\n§7毎日最初の3回のふれあいが最も効果的です。"
  page-5: "§l§5📈 成長\n\n§r§7ふれあいで経験値を得てレベルアップ。\n§7ごはんにはニャン力を得るチャンスがあります。\n§7ニャン力でニャンランクが上がり、スキルスロットが解放され、\n§7戦闘では猫があなたを守ってくれます。"
  page-6: "§l§6⚔ 戦闘\n\n§r§7フォローモードの猫は\n§7主人の近くの敵モブを攻撃します。\n§7ケガをした猫は90秒休むと回復します——\n§7猫は死にません。"
  page-7: "§l§8🏆 実績\n\n§r§7猫とのふれあいのひとつひとつが\n§7実績を解放するかもしれません。\n§7/nekoyume achievements で\n§7実績の殿堂を開けます。"
  page-8: "§l§d🌙 夢魔の夜\n\n§r§7どんな夜にも訪れるかもしれません。\n§7夢魔の夜のモンスターは遥かに強いですが、\n§7倒せばニャンダンを落とすことがあります。\n§7🐱 冒険を楽しんでください！"

