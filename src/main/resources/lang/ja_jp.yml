#
# Neko n' Yume 言語ファイル（日本語）
#
# チャットメッセージは MiniMessage テンプレートを使用します。
# {0} {1} … は引数プレースホルダーです（解析後に安全に置換されます）。
# プレーン文字列（GUI のアイテム名 / lore / タイトル）は § カラーコードを使用します。
# サーバー側上書きファイル: plugins/NekoNYume/lang/ja_jp.yml
# /nekoyumeadmin reload で再読み込みされます。

#
# ---------- コマンド ----------
#
command:
  no-cat: "<red>🐱 まだ猫を飼っていません！</red>"
  unknown: "<yellow>使い方: /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Neko n' Yume コマンド
    </gradient>

    <gray>/nekoyume claim</gray> - 最初の猫を迎える
    <gray>/nekoyume cat</gray> - 猫の情報を見る
    <gray>/nekoyume rename &lt;名前&gt;</gray> - 猫の名前を変える
    <gray>/nekoyume summon</gray> - 猫を呼び寄せる
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - 行動モードを設定
    <gray>/nekoyume gui</gray> - 猫パネルを開く
    <gray>/nekoyume skill</gray> - スキルパネルを開く
    <gray>/nekoyume tool</gray> - 猫じゃらしを受け取る
    <gray>/nekoyume language &lt;auto|zh_cn|en_us|ja_jp&gt;</gray> - 言語を設定
    <gray>/nekoyume achievements</gray> - 実績の殿堂を見る
    <gray>/nekoyume help</gray> - ヘルプを表示
  claim:
    already-has: "<red>🐱 もう猫を飼っています！</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 おめでとう！初めての猫、</gradient>{0}！"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}はもうあなたのそばに来ています！"
  cat:
    data-error: "<red>🐱 猫のデータが異常です。管理者に連絡してください。</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 あなたの猫</gradient>"
    name: "名前: {0}"
    days: "<white>一緒に: <aqua>{0}日目</aqua>"
    level: "<white>レベル: <yellow>{0}</yellow> <gray>(経験値 {1}/{2})</gray>"
    meow: "<white>ニャンランク: <light_purple>{0}</light_purple> <gray>(ニャン力 {1}/{2})</gray>"
    mood: "<white>機嫌: <yellow>{0} {1}</yellow>"
    personality: "<white>性格: <aqua>{0}</aqua>"
    tier: "<white>素質: <aqua>{0}</aqua>"
    behavior: "<white>行動: <aqua>{0}</aqua>"
  mode:
    usage: "<yellow>使い方: /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ 不明なモード: {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 行動モードを</gradient>{0}に変更しました"
  rename:
    usage: "<yellow>使い方: /nekoyume rename <名前></yellow>"
    empty: "<red>❌ 猫の名前を空にはできません！</red>"
    too-long: "<red>❌ 名前は16文字以内にしてください！</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 あなたの猫は</gradient>{0}という名前になりました！"
  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}があなたのそばに現れました！"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}があなたのところへやって来ました！"
  tool:
    received: "<gradient:#ff9de2:#a78bfa>🐱 猫じゃらしを手に入れました！右クリックで使えます！</gradient>"
    inventory-full: "<yellow>🐱 インベントリがいっぱいなので、猫じゃらしは足元に落ちました。</yellow>"
  language:
    usage: "<yellow>使い方: /nekoyume language <auto|zh_cn|en_us|ja_jp></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 プラグインの言語を</gradient>{0}に設定しました！"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 プラグインの言語がMinecraftの言語設定に従うようになりました。</gradient>"
    unknown: "<red>❌ 不明な言語: {0}</red>"
  achievements:
    disabled: "<red>🏆 実績システムは無効になっています。</red>"

#
# ---------- 管理コマンド ----------
#
admin:
  no-permission: "<red>❌ このコマンドを実行する権限がありません！</red>"
  usage: "<yellow>使い方: /nekoyumeadmin <meowdan|cat|skill|mumanight|reload></yellow>"
  reload-done: "<gradient:#a7f3d0:#60a5fa>✔ Neko n' Yume の設定を再読み込みしました！</gradient>"
  meowdan-usage: "<yellow>使い方: /nekoyumeadmin meowdan give <プレイヤー> <品質> [個数]</yellow>"
  meowdan-quality-hint: "<gray>品質: COMMON / UNCOMMON / RARE / EPIC / LEGENDARY</gray>"
  player-offline: "<red>❌ プレイヤーがオフラインです！</red>"
  unknown-quality: "<red>❌ 不明な品質: {0}</red>"
  invalid-amount: "<red>❌ 無効な個数です！</red>"
  amount-positive: "<red>❌ 個数は0より大きくしてください！</red>"
  give-cap: "<yellow>⚠ 一度に配れるのは{0}個までです。上限で処理しました。</yellow>"
  give-sender: "<gradient:#a7f3d0:#60a5fa>✔ </gradient>{0}に {1}個の {2}を渡しました"
  give-target: "<gradient:#c4b5fd:#a78bfa>✨ </gradient>{0}を受け取りました"
  cat-usage: "<yellow>使い方: /nekoyumeadmin cat <remove> <プレイヤー> [confirm]</yellow>"
  player-not-found: "<red>❌ プレイヤーが見つかりません。</red>"
  no-cat-data: "<red>❌ そのプレイヤーには猫のデータがありません。</red>"
  remove-warning: "<red>⚠ この操作は猫のデータを完全に削除し、元に戻せません！</red>"
  remove-confirm: "<yellow>確認するには実行: /nekoyumeadmin cat remove {0} confirm</yellow>"
  remove-done: "<red>✔ {0}の猫データを削除しました。</red>"
  remove-fail: "<red>❌ 削除に失敗しました：そのプレイヤーには猫のデータがありません。</red>"
  skill-usage: "<yellow>使い方: /nekoyumeadmin skill give <プレイヤー> <スキルID></yellow>"
  skill-hint: "<gray>使用可能なスキル: SHARP_CLAW LIGHT_STEP LIGHT_FUR ALERT WARMTH SMALL_APPETITE IRON_WALL HUNTER_SENSE GUARDIAN FORAGER HEALING_PURR SWIFT_PAWS HUNTING_INSTINCT SPIRIT_SHOT SHADOW_STRIKE DRAIN STAR_DUST NINE_LIVES MEOW_GUARD FLASH_OF_SPIRIT DREAM_AWAKEN STARFALL MOONLIGHT ETERNITY TIME_ECHO RESONANCE DREAM_WEAVER</gray>"
  unknown-skill: "<red>❌ 不明なスキル: {0}</red>"
  skill-granted: "<green>✔ </green>{0}にスキル {1}を付与しました"
  skill-granted-target: "<gradient:#fde68a:#f59e0b>🎉 あなたの猫は新しいスキルを覚えました：</gradient>{0}"
  skill-grant-fail: "<red>❌ そのプレイヤーは既にこのスキルを持っています。</red>"
  mumanight-player-only: "<red>❌ このコマンドはプレイヤー専用です。</red>"
  mumanight-status: "<yellow>🌑 夢魔の夜（現在のワールド）：</yellow> {0} <gray>使い方: /nekoyumeadmin mumanight <on|off></gray>"
  mumanight-on: "<dark_red>✔ 夢魔の夜を有効にしました。</dark_red>"
  mumanight-off: "<gold>✔ 夢魔の夜を無効にしました。</gold>"
  mumanight-usage: "<yellow>使い方: /nekoyumeadmin mumanight <on|off></yellow>"

