  wand-name: "§d🐱 Varita de gato"
  wand-lore: "§7Clic derecho para abrir el panel del gato"
  claim-title: "§d🎉 ¡Has conseguido un gato!"
  claim-subtitle: "§7§oBienvenido a 猫と夢 · Neko n' Yume"

#
# ---------- Libro del principiante ----------
#
book:
  title: "§d🐱 Guía de 猫と夢"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 ¡Bienvenido a 猫と夢!\n\n§r§7Este es un pequeño mundo para ti y tu gato.\n§7Este gatito siempre estará a tu lado."
  page-2: "§l§2🐾 Operaciones básicas\n\n§r§7Clic derecho con la varita abre el panel.\n§7El panel muestra el estado del gato\n§7y permite cambiar a las habilidades.\n§7Agáchate junto al gato para acariciarlo."
  page-3: "§l§3🍖 Alimentar\n\n§r§7Clic derecho con comida sobre el gato lo alimenta.\n§7La comida sube saciedad y afecto.\n§7Hambriento, el gato adelgaza:\n§7recuerda alimentarlo a menudo."
  page-4: "§l§4💖 Afecto\n\n§r§7Acariciar y alimentar aumentan el afecto.\n§7El afecto influye en el aura y los regalos.\n§7Las 3 primeras interacciones del día son las mejores."
  page-5: "§l§5📈 Crecimiento\n\n§r§7Las interacciones dan XP para subir de nivel.\n§7Alimentar puede dar poder miau,\n§7que sube el rango y desbloquea ranuras.\n§7En combate, el gato te protege."
  page-6: "§l§6⚔ Combate\n\n§r§7En modo seguir, el gato ataca\n§7a los enemigos cerca del dueño.\n§7Herido, descansa 90 segundos\n§7y nunca muere."
  page-7: "§l§8🏆 Logros\n\n§r§7Cada interacción con el gato\n§7puede desbloquear logros.\n§7/nekoyume achievements\n§7muestra el salón de logros."
  page-8: "§l§d🌙 Noche de la pesadilla\n\n§r§7Puede caer cada noche.\n§7Monstruos más fuertes,\n§7pero con Danes miau de botín.\n§7🐱 ¡Disfruta la aventura con tu gato!"

