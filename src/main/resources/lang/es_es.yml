#
# Archivo de idioma Neko n' Yume (español)
#
# Los mensajes de chat usan plantillas MiniMessage;
# {0} {1} … son marcadores de posición (reemplazados tras el análisis,
# el texto de los jugadores nunca se interpreta como etiquetas).
# Las cadenas puras (nombres de objetos GUI / lore / títulos) usan códigos de color §.
# Archivo de anulación del servidor: plugins/NekoNYume/lang/es_es.yml
# Recarga en caliente con /nekoyumeadmin reload.

#
# ---------- Comandos ----------
#
command:
  no-cat: "<red>🐱 ¡Aún no tienes gato!</red>"
  unknown: "<yellow>Uso: /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"

  model-no-cat: "<yellow>Aún no tienes gato.</yellow>"
  model-current: "<aqua>Modelo de tu gato: </aqua><gray>{0}</gray>"
  model-default: "<aqua>Modelo de tu gato: </aqua><gray>por defecto (sin especificar)</gray>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Comandos de Neko n' Yume
    </gradient>

    <gray>/nekoyume claim</gray> - Adoptar a tu primer gato
    <gray>/nekoyume cat</gray> - Ver a tu gato
    <gray>/nekoyume rename &lt;nombre&gt;</gray> - Renombrar a tu gato
    <gray>/nekoyume summon</gray> - Invocar a tu gato
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - Cambiar el modo de comportamiento
    <gray>/nekoyume gui</gray> - Abrir el panel del gato
    <gray>/nekoyume skill</gray> - Abrir el panel de habilidades
    <gray>/nekoyume tool</gray> - Recibir la varita de gato
    <gray>/nekoyume language &lt;auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es&gt;</gray> - Elegir idioma del plugin
    <gray>/nekoyume achievements</gray> - Ver el salón de logros
    <gray>/nekoyume help</gray> - Mostrar ayuda

  claim:
    already-has: "<red>🐱 ¡Ya tienes un gato!</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 ¡Felicidades! Este es tu primer gato </gradient>{0}!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} ha llegado a tu lado!"

  cat:
    data-error: "<red>🐱 Los datos de tu gato son anómalos, contacta con un administrador.</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 Tu gato</gradient>"
    name: "Nombre: {0}"
    days: "<white>Juntos: <aqua>día {0}</aqua>"
    level: "<white>Nivel: <yellow>{0}</yellow> <gray>(XP {1}/{2})</gray>"
    meow: "<white>Rango miau: <light_purple>{0}</light_purple> <gray>(Poder miau {1}/{2})</gray>"
    mood: "<white>Ánimo: <yellow>{0} {1}</yellow>"
    personality: "<white>Personalidad: <aqua>{0}</aqua>"
    tier: "<white>Esencia: <aqua>{0}</aqua>"
    behavior: "<white>Comportamiento: <aqua>{0}</aqua>"
    bond: "<white>Vínculo: <light_purple>{0}</light_purple> <gray>({1}/100)</gray>"
    combat-bonus: "<white>Bonus de combate: <red>{0}%</red></white>"
    equipment: "<white>Equipo: <gold>{0}</gold></white>"

  mode:
    usage: "<yellow>Uso: /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ Modo desconocido: {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 Modo de comportamiento cambiado a </gradient>{0}"

  rename:
    usage: "<yellow>Uso: /nekoyume rename <nombre></yellow>"
    empty: "<red>❌ ¡El nombre del gato no puede estar vacío!</red>"
    too-long: "<red>❌ ¡El nombre del gato no puede superar 16 caracteres!</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 ¡Tu gato ahora se llama </gradient>{0}!"

  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} ha aparecido a tu lado!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} ha venido a tu lado!"

  tool:
    received: "<gradient:#ff9de2:#a78bfa>🐱 ¡Has recibido una varita de gato, clic derecho para usarla!</gradient>"
    inventory-full: "<yellow>🐱 Inventario lleno, la varita ha caído a tus pies.</yellow>"

  language:
    usage: "<yellow>Uso: /nekoyume language <auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 ¡Idioma del plugin cambiado a </gradient>{0}!"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 El idioma del plugin ahora sigue tu configuración de Minecraft.</gradient>"
    unknown: "<red>❌ Idioma desconocido: {0}</red>"

  achievements:
    disabled: "<red>🏆 El sistema de logros está desactivado.</red>"

