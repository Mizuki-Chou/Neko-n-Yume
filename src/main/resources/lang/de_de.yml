#
# Neko n' Yume Sprachdatei (Deutsch)
#
# Chat-Nachrichten verwenden MiniMessage-Vorlagen;
# {0} {1} … sind Platzhalter (nach dem Parsen sicher ersetzt,
# Spielertext wird nie als Tags interpretiert).
# Reine Strings (GUI-Itemnamen / Lore / Titel) verwenden §-Farbcodes.
# Server-Override-Datei: plugins/NekoNYume/lang/de_de.yml
# Hot-Reload via /nekoyumeadmin reload.

#
# ---------- Befehle ----------
#
command:
  no-cat: "<red>🐱 Du hast noch keine Katze!</red>"
  unknown: "<yellow>Verwendung: /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"

  model-no-cat: "<yellow>Du hast noch keine Katze.</yellow>"
  model-current: "<aqua>Modell deiner Katze: </aqua><gray>{0}</gray>"
  model-default: "<aqua>Modell deiner Katze: </aqua><gray>Standard (nicht festgelegt)</gray>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Neko n' Yume Befehle
    </gradient>

    <gray>/nekoyume claim</gray> - Deine erste Katze adoptieren
    <gray>/nekoyume cat</gray> - Deine Katze ansehen
    <gray>/nekoyume rename &lt;Name&gt;</gray> - Katze umbenennen
    <gray>/nekoyume summon</gray> - Katze beschwören
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - Verhaltensmodus
    <gray>/nekoyume gui</gray> - Katzenpanel öffnen
    <gray>/nekoyume skill</gray> - Fähigkeitenpanel öffnen
    <gray>/nekoyume tool</gray> - Katzenangel erhalten
    <gray>/nekoyume language &lt;auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es&gt;</gray> - Plugin-Sprache wählen
    <gray>/nekoyume achievements</gray> - Erfolgshalle ansehen
    <gray>/nekoyume help</gray> - Hilfe anzeigen

  claim:
    already-has: "<red>🐱 Du hast bereits eine Katze!</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 Glückwunsch! Das ist deine erste Katze </gradient>{0}!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} ist an deine Seite gekommen!"

  cat:
    data-error: "<red>🐱 Die Daten deiner Katze sind fehlerhaft, wende dich an einen Admin.</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 Deine Katze</gradient>"
    name: "Name: {0}"
    days: "<white>Gemeinsam: <aqua>Tag {0}</aqua>"
    level: "<white>Level: <yellow>{0}</yellow> <gray>(EP {1}/{2})</gray>"
    meow: "<white>Miau-Rang: <light_purple>{0}</light_purple> <gray>(Miau-Kraft {1}/{2})</gray>"
    mood: "<white>Laune: <yellow>{0} {1}</yellow>"
    personality: "<white>Persönlichkeit: <aqua>{0}</aqua>"
    tier: "<white>Wesen: <aqua>{0}</aqua>"
    behavior: "<white>Verhalten: <aqua>{0}</aqua>"
    bond: "<white>Bande: <light_purple>{0}</light_purple> <gray>({1}/100)</gray>"
    combat-bonus: "<white>Kampfbonus: <red>{0}%</red></white>"
    equipment: "<white>Ausrüstung: <gold>{0}</gold></white>"

  mode:
    usage: "<yellow>Verwendung: /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ Unbekannter Modus: {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 Verhaltensmodus geändert zu </gradient>{0}"

  rename:
    usage: "<yellow>Verwendung: /nekoyume rename <Name></yellow>"
    empty: "<red>❌ Der Katzenname darf nicht leer sein!</red>"
    too-long: "<red>❌ Der Katzenname darf höchstens 16 Zeichen haben!</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 Deine Katze heißt jetzt </gradient>{0}!"

  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} ist neben dir erschienen!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} ist zu dir gekommen!"

  tool:
    received: "<gradient:#ff9de2:#a78bfa>🐱 Du hast eine Katzenangel erhalten, Rechtsklick zum Benutzen!</gradient>"
    inventory-full: "<yellow>🐱 Inventar voll, die Angel ist zu deinen Füßen gelandet.</yellow>"

  language:
    usage: "<yellow>Verwendung: /nekoyume language <auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 Plugin-Sprache geändert zu </gradient>{0}!"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 Die Plugin-Sprache folgt jetzt deinen Minecraft-Einstellungen.</gradient>"
    unknown: "<red>❌ Unbekannte Sprache: {0}</red>"

  achievements:
    disabled: "<red>🏆 Das Erfolgssystem ist deaktiviert.</red>"

