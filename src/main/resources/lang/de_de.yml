tool:
  already: "<yellow>Du hast schon eine Katzenangel.</yellow>"
  wand-name: "§d🐱 Katzenangel"
  wand-lore: "§7Rechtsklick öffnet das Katzenpanel"
  claim-title: "§d🎉 Du hast eine Katze bekommen!"
  claim-subtitle: "§7§oWillkommen bei 猫と夢 · Neko n' Yume"

#
# ---------- Einsteigerbuch ----------
#
book:
  title: "§d🐱 猫と夢 Einsteiger-Guide"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 Willkommen bei 猫と夢!\n\n§r§7Dies ist eine kleine Welt für dich und deine Katze.\n§7Dieses Kätzchen bleibt immer an deiner Seite."
  page-2: "§l§2🐾 Grundlagen\n\n§r§7Rechtsklick mit der Angel öffnet das Panel.\n§7Im Panel siehst du den Zustand der Katze\n§7und wechselst zum Skill-Bildschirm.\n§7Schleiche neben der Katze, um sie zu streicheln."
  page-3: "§l§3🍖 Füttern\n\n§r§7Rechtsklick mit Futter auf die Katze füttert sie.\n§7Futter erhöht Sättigung und Zuneigung.\n§7Hungrig wird die Katze mager —\n§7füttere sie regelmäßig."
  page-4: "§l§4💖 Zuneigung\n\n§r§7Streicheln und Füttern erhöhen die Zuneigung.\n§7Zuneigung beeinflusst Aura und Geschenke.\n§7Die ersten 3 Interaktionen des Tages sind am stärksten."
  page-5: "§l§5📈 Wachstum\n\n§r§7Interaktionen geben EP und Level.\n§7Füttern kann Miau-Kraft bringen,\n§7die den Rang hebt und Slots freischaltet.\n§7Im Kampf beschützt dich die Katze."
  page-6: "§l§6⚔ Kampf\n\n§r§7Im Folgen-Modus greift die Katze\n§7feindliche Wesen nahe dem Besitzer an.\n§7Verletzt ruht sie 90 Sekunden\n§7und stirbt nie."
  page-7: "§l§8🏆 Erfolge\n\n§r§7Jede Interaktion mit der Katze\n§7kann Erfolge freischalten.\n§7/nekoyume achievements\n§7zeigt die Erfolgshalle."
  page-8: "§l§d🌙 Nacht des Dämons\n\n§r§7Sie kann jede Nacht hereinbrechen.\n§7Stärkere Monster,\n§7aber Miau-Dan als Beute.\n§7🐱 Viel Spaß beim Abenteuer mit deiner Katze!"

