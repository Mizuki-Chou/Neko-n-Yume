  claim-subtitle: "§7§o歡迎來到 猫と夢 · Neko n' Yume"

#
# ---------- 入門書 ----------
#
book:
  title: "§d🐱 猫と夢 入門指南"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 歡迎來到 猫と夢!\n\n§r§7這裡是屬於你和貓咪的小世界。\n§7這隻小貓會一直陪在你身邊。"
  page-2: "§l§2🐾 基礎操作\n\n§r§7逗貓棒右鍵開啟貓咪面板。\n§7面板裡可以查看貓咪狀態，\n§7切換到技能介面。\n§7在貓咪身邊潛行可以撫摸它。"
  page-3: "§l§3🍖 餵食\n\n§r§7拿著食物右鍵貓咪即可餵食。\n§7餵食增加飽食度與好感度。\n§7飢餓時貓咪會變瘦，\n§7記得常餵好吃的。"
  page-4: "§l§4💖 好感度\n\n§r§7撫摸與餵食都會增加好感。\n§7好感度影響光環與禮物。\n§7每天前 3 次互動效果最好。"
  page-5: "§l§5📈 成長\n\n§r§7互動獲得經驗升級，\n§7餵食有機率獲得喵力。\n§7喵力提升喵階，解鎖技能槽，\n§7戰鬥中貓咪會主動保護你。"
  page-6: "§l§6⚔ 戰鬥\n\n§r§7跟隨模式下貓咪會攻擊\n§7主人附近的敵對生物。\n§7貓咪受傷後會休息 90 秒恢復，\n§7不會死亡。"
  page-7: "§l§8🏆 成就\n\n§r§7與貓咪的每一次互動\n§7都可能解鎖成就。\n§7輸入 /nekoyume achievements\n§7查看成就殿堂。"
  page-8: "§l§d🌙 夢魔之夜\n\n§r§7每個夜晚都有機率降臨。\n§7夢魔之夜中怪物更強，\n§7但擊殺有機會掉落喵丹。\n§7🐱 祝你和貓咪冒險愉快!"

