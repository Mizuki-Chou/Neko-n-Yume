#
# Neko n' Yume 語言檔案（繁體中文）
#
# 聊天訊息使用 MiniMessage 模板；
# {0} {1} … 為參數佔位符（解析後安全替換，玩家文字不會被解析為標籤）。
# 純字串（GUI 物品名 / lore / title）使用 § 色碼。
# 伺服器端覆蓋檔案：plugins/NekoNYume/lang/zh_tw.yml
# /nekoyumeadmin reload 熱重載。

#
# ---------- 命令 ----------
#
command:
  no-cat: "<red>🐱 你還沒有貓咪!</red>"
  unknown: "<yellow>用法: /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Neko n' Yume Commands
    </gradient>

    <gray>/nekoyume claim</gray> - 領取你的第一隻貓
    <gray>/nekoyume cat</gray> - 查看你的貓
    <gray>/nekoyume rename &lt;名字&gt;</gray> - 重新命名你的貓
    <gray>/nekoyume summon</gray> - 召喚你的貓
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - 設定行為模式
    <gray>/nekoyume gui</gray> - 開啟貓咪面板
    <gray>/nekoyume skill</gray> - 開啟技能面板
    <gray>/nekoyume tool</gray> - 領取快捷逗貓棒
    <gray>/nekoyume language &lt;auto|zh_cn|zh_tw|en_us|ja_jp&gt;</gray> - 設定插件語言
    <gray>/nekoyume achievements</gray> - 查看成就殿堂
    <gray>/nekoyume help</gray> - 顯示幫助

  claim:
    already-has: "<red>🐱 你已經擁有貓咪了!</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 恭喜！你獲得了第一隻貓 </gradient>{0}!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}已經來到你身邊了!"

  cat:
    data-error: "<red>🐱 你的貓咪資料異常，請聯繫管理員。</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 你的貓</gradient>"
    name: "名字: {0}"
    days: "<white>陪伴: <aqua>第 {0} 天</aqua>"
    level: "<white>等級: <yellow>{0}</yellow> <gray>(經驗 {1}/{2})</gray>"
    meow: "<white>喵階: <light_purple>{0}</light_purple> <gray>(喵力 {1}/{2})</gray>"
    mood: "<white>心情: <yellow>{0} {1}</yellow>"
    personality: "<white>性格: <aqua>{0}</aqua>"
    tier: "<white>底蘊: <aqua>{0}</aqua>"
    behavior: "<white>行為: <aqua>{0}</aqua>"
    bond: "<white>羈絆: <light_purple>{0}</light_purple> <gray>({1}/100)</gray>"
    combat-bonus: "<white>戰鬥加成: <red>{0}%</red></white>"
    equipment: "<white>裝備: <gold>{0}</gold></white>"

  mode:
    usage: "<yellow>用法: /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ 未知模式: {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 行為模式已切換為 </gradient>{0}"

  rename:
    usage: "<yellow>用法: /nekoyume rename <名字></yellow>"
    empty: "<red>❌ 貓咪名字不能為空!</red>"
    too-long: "<red>❌ 貓咪名字不能超過 16 個字元!</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 你的貓現在叫 </gradient>{0}了!"

  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}出現在你身邊!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}來到你身邊啦!"

  tool:
    received: "<gradient:#ff9de2:#a78bfa>🐱 你獲得了一根逗貓棒，右鍵使用!</gradient>"
    inventory-full: "<yellow>🐱 背包已滿，逗貓棒掉在你的腳邊。</yellow>"

  language:
    usage: "<yellow>用法: /nekoyume language <auto|zh_cn|zh_tw|en_us|ja_jp></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 插件語言已切換為 </gradient>{0}！"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 插件語言現在跟隨你的 Minecraft 語言設定。</gradient>"
    unknown: "<red>❌ 未知語言: {0}</red>"

  achievements:
    disabled: "<red>🏆 成就系統未開啟。</red>"

