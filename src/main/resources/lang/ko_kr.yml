#
# Neko n' Yume 언어 파일 (한국어)
#
# 채팅 메시지는 MiniMessage 템플릿을 사용합니다.
# {0} {1} … 은 매개변수 자리표시자입니다 (파싱 후 안전하게 치환되며,
# 플레이어 텍스트는 태그로 해석되지 않습니다).
# 순수 문자열(GUI 아이템 이름 / lore / title)은 § 색상 코드를 사용합니다.
# 서버측 재정의 파일: plugins/NekoNYume/lang/ko_kr.yml
# /nekoyumeadmin reload 로 핫 리로드됩니다.

#
# ---------- 명령어 ----------
#
command:
  no-cat: "<red>🐱 아직 고양이가 없어요!</red>"
  unknown: "<yellow>사용법: /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"

  model-no-cat: "<yellow>아직 고양이가 없네요.</yellow>"
  model-current: "<aqua>당신 고양이의 모델: </aqua><gray>{0}</gray>"
  model-default: "<aqua>당신 고양이의 모델: </aqua><gray>기본값 (미지정)</gray>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Neko n' Yume 명령어
    </gradient>

    <gray>/nekoyume claim</gray> - 첫 고양이 입양하기
    <gray>/nekoyume cat</gray> - 고양이 정보 보기
    <gray>/nekoyume rename &lt;이름&gt;</gray> - 고양이 이름 바꾸기
    <gray>/nekoyume summon</gray> - 고양이 소환하기
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - 행동 모드 설정
    <gray>/nekoyume gui</gray> - 고양이 패널 열기
    <gray>/nekoyume skill</gray> - 스킬 패널 열기
    <gray>/nekoyume tool</gray> - 고양이 낚싯대 받기
    <gray>/nekoyume language &lt;auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es&gt;</gray> - 플러그인 언어 설정
    <gray>/nekoyume achievements</gray> - 업적 전당 보기
    <gray>/nekoyume help</gray> - 도움말 보기

  claim:
    already-has: "<red>🐱 이미 고양이가 있어요!</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 축하해요! 첫 고양이 </gradient>{0}!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}이(가) 곁에 찾아왔어요!"

  cat:
    data-error: "<red>🐱 고양이 데이터에 문제가 있습니다. 관리자에게 문의하세요.</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 당신의 고양이</gradient>"
    name: "이름: {0}"
    days: "<white>함께한 지: <aqua>{0}일째</aqua>"
    level: "<white>레벨: <yellow>{0}</yellow> <gray>(경험치 {1}/{2})</gray>"
    meow: "<white>냥 계급: <light_purple>{0}</light_purple> <gray>(냥력 {1}/{2})</gray>"
    mood: "<white>기분: <yellow>{0} {1}</yellow>"
    personality: "<white>성격: <aqua>{0}</aqua>"
    tier: "<white>품격: <aqua>{0}</aqua>"
    behavior: "<white>행동: <aqua>{0}</aqua>"
    bond: "<white>유대: <light_purple>{0}</light_purple> <gray>({1}/100)</gray>"
    combat-bonus: "<white>전투 보너스: <red>{0}%</red></white>"
    equipment: "<white>장비: <gold>{0}</gold></white>"

  mode:
    usage: "<yellow>사용법: /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ 알 수 없는 모드: {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 행동 모드를 </gradient>{0}(으)로 바꿨어요"

  rename:
    usage: "<yellow>사용법: /nekoyume rename <이름></yellow>"
    empty: "<red>❌ 고양이 이름은 비워둘 수 없어요!</red>"
    too-long: "<red>❌ 고양이 이름은 16자를 넘을 수 없어요!</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 이제 고양이 이름은 </gradient>{0}!"

  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}이(가) 곁에 나타났어요!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}이(가) 곁으로 왔어요!"

  tool:
    received: "<gradient:#ff9de2:#a78bfa>🐱 고양이 낚싯대를 받았어요. 우클릭으로 사용하세요!</gradient>"
    inventory-full: "<yellow>🐱 인벤토리가 가득 차서 낚싯대가 발밑에 떨어졌어요.</yellow>"

  language:
    usage: "<yellow>사용법: /nekoyume language <auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 플러그인 언어를 </gradient>{0}(으)로 바꿨어요!"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 이제 플러그인 언어가 마인크래프트 언어 설정을 따라갑니다.</gradient>"
    unknown: "<red>❌ 알 수 없는 언어: {0}</red>"

  achievements:
    disabled: "<red>🏆 업적 시스템이 꺼져 있어요.</red>"

#
# ---------- 관리자 명령어 ----------
#
admin:
  ranking-delete-done: "<green>✔ {0}의 고양이 {1}을(를) 삭제했습니다.</green>"
  ranking-delete-failed: "<red>❌ {0}의 고양이 삭제에 실패했습니다.</red>"
  ranking-delete-notify: "<red>당신의 고양이 {0}이(가) 관리자에 의해 삭제되었습니다.</red>"
  ranking-target-missing: "<yellow>이 고양이는 더 이상 존재하지 않습니다.</yellow>"
  no-permission: "<red>❌ 이 명령어를 실행할 권한이 없어요!</red>"
  usage: "<yellow>사용법: /nekoyumeadmin <meowdan|cat|skill|mumanight|model|reload></yellow>"
  reload-done: "<gradient:#a7f3d0:#60a5fa>✔ Neko n' Yume 설정을 다시 불러왔어요!</gradient>"
  reload-failed: "<red>설정 핫 리로드에 실패했습니다 — 기존 설정이 유지됩니다.</red>"
  player-only: "<red>❌ 이 명령어는 플레이어만 사용할 수 있어요.</red>"

  model-usage: "<yellow>사용법: /nekoyumeadmin model <reload|list|set <플레이어> <모델ID>|clear <플레이어>></yellow>"
  model-reload-started: "<gray>모델을 다시 불러오는 중입니다 (비동기)…</gray>"
  model-reload-done: "<gradient:#a7f3d0:#60a5fa>✔ 모델 리로드가 끝났습니다.</gradient>"
  model-reload-superseded: "<yellow>모델 리로드가 더 새로운 요청으로 대체되었습니다.</yellow>"
  model-reload-shutdown: "<yellow>플러그인이 종료 중이라 모델 리로드가 실행되지 않았습니다.</yellow>"
  model-reload-failed: "<red>모델 리로드 실패 (리소스팩 빌드 실패) — 기존 모델이 유지됩니다.</red>"
  model-list-empty: "<yellow>로드된 모델이 없습니다 (models 폴더를 확인하세요).</yellow>"
  model-list: "<aqua>로드된 모델: </aqua><gray>{0}</gray>"
  model-set-done: "<gradient:#a7f3d0:#60a5fa>✔ {0}의 고양이 모델을 {1}(으)로 설정했습니다.</gradient>"
  model-clear-done: "<gradient:#a7f3d0:#60a5fa>✔ {0}의 고양이 모델을 초기화했습니다 (기본값으로 복귀).</gradient>"
  model-set-failed: "<red>❌ 설정 실패: 플레이어에게 고양이가 없거나 모델 ID가 올바르지 않습니다.</red>"

  meowdan-usage: "<yellow>사용법: /nekoyumeadmin meowdan give <플레이어> <품질> [수량]</yellow>"
  meowdan-quality-hint: "<gray>품질: 평범 / 정밀 / 고유 / 탁월 / 지극</gray>"
  player-offline: "<red>❌ 플레이어가 접속 중이 아니에요!</red>"
  unknown-quality: "<red>❌ 알 수 없는 품질: {0}</red>"
  invalid-amount: "<red>❌ 올바르지 않은 수량이에요!</red>"
  amount-positive: "<red>❌ 수량은 0보다 커야 해요!</red>"
  give-cap: "<yellow>⚠ 한 번에 최대 {0}개까지만 지급할 수 있어 상한에 맞춰 처리했습니다.</yellow>"
  give-sender: "<gradient:#a7f3d0:#60a5fa>✔ </gradient>{0}에게 {1} {2}개를 지급했습니다"
  give-target: "<gradient:#c4b5fd:#a78bfa>✨ </gradient>{0}을(를) 받았어요"

  cat-usage: "<yellow>사용법: /nekoyumeadmin cat <remove> <플레이어> [confirm]</yellow>"
  player-not-found: "<red>❌ 플레이어를 찾을 수 없습니다.</red>"
  no-cat-data: "<red>❌ 이 플레이어에게 고양이 데이터가 없습니다.</red>"
  remove-warning: "<red>⚠ 이 작업은 고양이의 모든 데이터를 삭제하며 되돌릴 수 없어요!</red>"
  remove-confirm: "<yellow>확인하려면 실행하세요: /nekoyumeadmin cat remove {0} confirm</yellow>"
  remove-done: "<red>✔ {0}의 고양이 데이터를 삭제했습니다.</red>"
  remove-fail: "<red>❌ 삭제 실패: 이 플레이어에게 고양이 데이터가 없습니다.</red>"

  skill-usage: "<yellow>사용법: /nekoyumeadmin skill give <플레이어> <스킬ID></yellow>"
  skill-hint: "<gray>사용 가능한 스킬: SHARP_CLAW LIGHT_STEP LIGHT_FUR ALERT WARMTH SMALL_APPETITE IRON_WALL HUNTER_SENSE GUARDIAN FORAGER HEALING_PURR SWIFT_PAWS HUNTING_INSTINCT SPIRIT_SHOT SHADOW_STRIKE DRAIN STAR_DUST NINE_LIVES MEOW_GUARD FLASH_OF_SPIRIT DREAM_AWAKEN STARFALL MOONLIGHT ETERNITY TIME_ECHO RESONANCE DREAM_WEAVER</gray>"
  unknown-skill: "<red>❌ 알 수 없는 스킬: {0}</red>"
  skill-granted: "<green>✔ </green>{0}에게 스킬 {1}을(를) 부여했습니다"
  skill-granted-target: "<gradient:#fde68a:#f59e0b>🎉 당신의 고양이가 새로운 스킬을 배웠어요: </gradient>{0}"
  skill-grant-fail: "<red>❌ 이 플레이어는 이미 이 스킬을 가지고 있어요.</red>"

  mumanight-player-only: "<red>❌ 이 명령어는 플레이어만 사용할 수 있어요.</red>"
  mumanight-status: "<yellow>🌑 악몽의 밤 (현재 월드): </yellow> {0} <gray>사용법: /nekoyumeadmin mumanight <on|off></gray>"
  mumanight-on: "<dark_red>✔ 악몽의 밤을 켰습니다.</dark_red>"
  mumanight-off: "<gold>✔ 악몽의 밤을 껐습니다.</gold>"
  mumanight-state-on: "켜짐"
  mumanight-state-off: "꺼짐"
  mumanight-usage: "<yellow>사용법: /nekoyumeadmin mumanight <on|off></yellow>"

