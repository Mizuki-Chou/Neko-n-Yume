#
# ---------- 입문서 ----------
#
book:
  title: "§d🐱 네코토 유메 입문 가이드"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 네코토 유메에 오신 것을 환영해요!\n\n§r§7이곳은 당신과 고양이의 작은 세계예요.\n§7이 작은 고양이는 언제나 당신 곁에 있을 거예요."
  page-2: "§l§2🐾 기본 조작\n\n§r§7낚싯대 우클릭으로 고양이 패널을 열어요.\n§7패널에서 고양이 상태를 확인하고\n§7스킬 화면으로 전환할 수 있어요.\n§7고양이 곁에서 웅크리면 쓰다듬을 수 있어요."
  page-3: "§l§3🍖 먹이 주기\n\n§r§7음식을 들고 고양이를 우클릭하면 먹이를 줘요.\n§7먹이는 포만감과 호감도를 올려줘요.\n§7배고프면 고양이가 야위어요.\n§7맛있는 걸 자주 챙겨주세요."
  page-4: "§l§4💖 호감도\n\n§r§7쓰다듬기와 먹이가 호감을 올려요.\n§7호감도는 오라와 선물에 영향을 줘요.\n§7하루 첫 3번의 상호작용이 가장 효과적이에요."
  page-5: "§l§5📈 성장\n\n§r§7상호작용으로 경험치를 얻어 레벨업하고\n§7먹이를 주면 일정 확률로 냥력을 얻어요.\n§7냥력은 냥 계급을 올리고 스킬 슬롯을 열어줘요.\n§7전투에서 고양이가 당신을 지켜줄 거예요."
  page-6: "§l§6⚔ 전투\n\n§r§7따라오기 모드에서 고양이는\n§7주인 근처의 적대적 몹을 공격해요.\n§7다치면 90초 동안 쉬며 회복하고\n§7죽지 않아요."
  page-7: "§l§8🏆 업적\n\n§r§7고양이와의 모든 상호작용이\n§7업적을 열 수 있어요.\n§7/nekoyume achievements 로\n§7업적 전당을 확인하세요."
  page-8: "§l§d🌙 악몽의 밤\n\n§r§7매일 밤 일정 확률로 찾아와요.\n§7악몽의 밤에는 몬스터가 더 강해지지만\n§7처치하면 냥단을 얻을 수 있어요.\n§7🐱 고양이와 즐거운 모험 되세요!"

