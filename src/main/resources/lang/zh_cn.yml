#
# ---------- 逗猫棒 ----------
#
tool:
  wand-name: "§d🐱 逗猫棒"
  wand-lore: "§7右键打开猫咪面板"
  claim-title: "§d🎉 你获得了猫咪!"
  claim-subtitle: "§7§o欢迎来到 猫と夢 · Neko n' Yume"

#
# ---------- 入门书 ----------
#
book:
  title: "§d🐱 猫と夢 入门指南"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 欢迎来到 猫と夢!\n\n§r§7这里是属于你和猫咪的小世界。\n§7这只小猫会一直陪在你身边。"
  page-2: "§l§2🐾 基础操作\n\n§r§7逗猫棒右键打开猫咪面板。\n§7面板里可以查看猫咪状态，\n§7切换到技能界面。\n§7在猫咪身边潜行可以抚摸它。"
  page-3: "§l§3🍖 喂食\n\n§r§7拿着食物右键猫咪即可喂食。\n§7喂食增加饱食度与好感度。\n§7饥饿时猫咪会变瘦，\n§7记得常喂好吃的。"
  page-4: "§l§4💖 好感度\n\n§r§7抚摸与喂食都会增加好感。\n§7好感度影响光环与礼物。\n§7每天前 3 次互动效果最好。"
  page-5: "§l§5📈 成长\n\n§r§7互动获得经验升级，\n§7喂食有概率获得喵力。\n§7喵力提升喵阶，解锁技能槽，\n§7战斗中猫咪会主动保护你。"
  page-6: "§l§6⚔ 战斗\n\n§r§7跟随模式下猫咪会攻击\n§7主人附近的敌对生物。\n§7猫咪受伤后会休息 90 秒恢复，\n§7不会死亡。"
  page-7: "§l§8🏆 成就\n\n§r§7与猫咪的每一次互动\n§7都可能解锁成就。\n§7输入 /nekoyume achievements\n§7查看成就殿堂。"
  page-8: "§l§d🌙 梦魔之夜\n\n§r§7每个夜晚都有概率降临。\n§7梦魔之夜中怪物更强，\n§7但击杀有机会掉落喵丹。\n§7🐱 祝你和猫咪冒险愉快!"

