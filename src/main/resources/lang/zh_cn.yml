#
# Neko n' Yume 语言文件（简体中文）
#
# 聊天消息使用 MiniMessage 模板；
# {0} {1} … 为参数占位符（解析后安全替换，玩家文本不会被解析为标签）。
# 纯字符串（GUI 物品名 / lore / title）使用 § 色码。
# 服务器端覆盖文件：plugins/NekoNYume/lang/zh_cn.yml
# /nekoyumeadmin reload 热重载。

#
# ---------- 命令 ----------
#
command:
  no-cat: "<red>🐱 你还没有猫咪!</red>"
  unknown: "<yellow>用法: /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Neko n' Yume Commands
    </gradient>

    <gray>/nekoyume claim</gray> - 领取你的第一只猫
    <gray>/nekoyume cat</gray> - 查看你的猫
    <gray>/nekoyume rename &lt;名字&gt;</gray> - 重命名你的猫
    <gray>/nekoyume summon</gray> - 召唤你的猫
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - 设置行为模式
    <gray>/nekoyume gui</gray> - 打开猫咪面板
    <gray>/nekoyume skill</gray> - 打开技能面板
    <gray>/nekoyume tool</gray> - 领取快捷逗猫棒
    <gray>/nekoyume language &lt;auto|zh_cn|zh_tw|en_us|ja_jp&gt;</gray> - 设置插件语言
    <gray>/nekoyume achievements</gray> - 查看成就殿堂
    <gray>/nekoyume help</gray> - 显示帮助

  claim:
    already-has: "<red>🐱 你已经拥有猫咪了!</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 恭喜！你获得了第一只猫 </gradient>{0}!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}已经来到了你身边!"

  cat:
    data-error: "<red>🐱 你的猫咪数据异常，请联系管理员。</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 你的猫</gradient>"
    name: "名字: {0}"
    days: "<white>陪伴: <aqua>第 {0} 天</aqua>"
    level: "<white>等级: <yellow>{0}</yellow> <gray>(经验 {1}/{2})</gray>"
    meow: "<white>喵阶: <light_purple>{0}</light_purple> <gray>(喵力 {1}/{2})</gray>"
    mood: "<white>心情: <yellow>{0} {1}</yellow>"
    personality: "<white>性格: <aqua>{0}</aqua>"
    tier: "<white>底蕴: <aqua>{0}</aqua>"
    behavior: "<white>行为: <aqua>{0}</aqua>"
    bond: "<white>羁绊: <light_purple>{0}</light_purple> <gray>({1}/100)</gray>"
    combat-bonus: "<white>战斗加成: <red>{0}%</red></white>"
    equipment: "<white>装备: <gold>{0}</gold></white>"

  mode:
    usage: "<yellow>用法: /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ 未知模式: {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 行为模式已切换为 </gradient>{0}"

  rename:
    usage: "<yellow>用法: /nekoyume rename <名字></yellow>"
    empty: "<red>❌ 猫咪名字不能为空!</red>"
    too-long: "<red>❌ 猫咪名字不能超过 16 个字符!</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 你的猫现在叫 </gradient>{0}了!"

  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}出现在你身边!"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0}来到你身边啦!"

  tool:
    received: "<gradient:#ff9de2:#a78bfa>🐱 你获得了一根逗猫棒，右键使用!</gradient>"
    inventory-full: "<yellow>🐱 背包已满，逗猫棒掉在了你的脚边。</yellow>"

  language:
    usage: "<yellow>用法: /nekoyume language <auto|zh_cn|zh_tw|en_us|ja_jp></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 插件语言已切换为 </gradient>{0}！"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 插件语言现在跟随你的 Minecraft 语言设置。</gradient>"
    unknown: "<red>❌ 未知语言: {0}</red>"

  achievements:
    disabled: "<red>🏆 成就系统未开启。</red>"

#
# ---------- 管理命令 ----------
#
admin:
  no-permission: "<red>❌ 你没有权限执行此命令!</red>"
  usage: "<yellow>用法: /nekoyumeadmin <meowdan|cat|skill|mumanight|reload></yellow>"
  reload-done: "<gradient:#a7f3d0:#60a5fa>✔ Neko n' Yume 配置重载成功!</gradient>"
  player-only: "<red>❌ 该命令只能由玩家执行。</red>"

  meowdan-usage: "<yellow>用法: /nekoyumeadmin meowdan give <玩家> <品质> [数量]</yellow>"
  meowdan-quality-hint: "<gray>品质: 平凡 / 精良 / 独特 / 卓越 / 至极</gray>"
  player-offline: "<red>❌ 玩家不在线!</red>"
  unknown-quality: "<red>❌ 未知品质: {0}</red>"
  invalid-amount: "<red>❌ 无效数量!</red>"
  amount-positive: "<red>❌ 数量必须大于 0!</red>"
  give-cap: "<yellow>⚠ 单次最多发放 {0} 个，已按上限处理。</yellow>"
  give-sender: "<gradient:#a7f3d0:#60a5fa>✔ 已给予 </gradient>{0} {1} 个 {2}"
  give-target: "<gradient:#c4b5fd:#a78bfa>✨ 你收到了 </gradient>{0}"

  cat-usage: "<yellow>用法: /nekoyumeadmin cat <remove> <玩家> [confirm]</yellow>"
  player-not-found: "<red>❌ 找不到该玩家。</red>"
  no-cat-data: "<red>❌ 该玩家没有猫咪数据。</red>"
  remove-warning: "<red>⚠ 该操作会删除猫咪的全部数据，且不可恢复!</red>"
  remove-confirm: "<yellow>确认请执行: /nekoyumeadmin cat remove {0} confirm</yellow>"
  remove-done: "<red>✔ 已删除 {0} 的猫咪数据。</red>"
  remove-fail: "<red>❌ 删除失败：该玩家没有猫咪数据。</red>"

  skill-usage: "<yellow>用法: /nekoyumeadmin skill give <玩家> <技能ID></yellow>"
  skill-hint: "<gray>可用技能: SHARP_CLAW LIGHT_STEP LIGHT_FUR ALERT WARMTH SMALL_APPETITE IRON_WALL HUNTER_SENSE GUARDIAN FORAGER HEALING_PURR SWIFT_PAWS HUNTING_INSTINCT SPIRIT_SHOT SHADOW_STRIKE DRAIN STAR_DUST NINE_LIVES MEOW_GUARD FLASH_OF_SPIRIT DREAM_AWAKEN STARFALL MOONLIGHT ETERNITY TIME_ECHO RESONANCE DREAM_WEAVER</gray>"
  unknown-skill: "<red>❌ 未知技能: {0}</red>"
  skill-granted: "<green>✔ 已授予 </green>{0} 技能 {1}"
  skill-granted-target: "<gradient:#fde68a:#f59e0b>🎉 你的猫咪学会了新技能：</gradient>{0}"
  skill-grant-fail: "<red>❌ 该玩家已经拥有这个技能。</red>"

  mumanight-player-only: "<red>❌ 该命令只能由玩家执行。</red>"
  mumanight-status: "<yellow>🌑 梦魔之夜（当前世界）：</yellow> {0} <gray>用法: /nekoyumeadmin mumanight <on|off></gray>"
  mumanight-on: "<dark_red>✔ 已开启梦魔之夜。</dark_red>"
  mumanight-off: "<gold>✔ 已关闭梦魔之夜。</gold>"
  mumanight-state-on: "开启"
  mumanight-state-off: "关闭"
  mumanight-usage: "<yellow>用法: /nekoyumeadmin mumanight <on|off></yellow>"

