#
# Fichier de langue Neko n' Yume (français)
#
# Les messages de chat utilisent des templates MiniMessage ;
# {0} {1} … sont des espaces réservés (remplacés après parsing,
# le texte des joueurs n'est jamais interprété comme des balises).
# Les chaînes pures (noms d'items GUI / lore / title) utilisent les codes couleur §.
# Fichier de remplacement serveur : plugins/NekoNYume/lang/fr_fr.yml
# Rechargement à chaud via /nekoyumeadmin reload.

#
# ---------- Commandes ----------
#
command:
  no-cat: "<red>🐱 Tu n'as pas encore de chat !</red>"
  unknown: "<yellow>Usage : /nekoyume <help|claim|cat|rename|summon|mode|gui|skill|tool|language|achievements></yellow>"

  model-no-cat: "<yellow>Tu n'as pas encore de chat.</yellow>"
  model-current: "<aqua>Modèle de ton chat : </aqua><gray>{0}</gray>"
  model-default: "<aqua>Modèle de ton chat : </aqua><gray>par défaut (non défini)</gray>"
  help: |
    <gradient:#ff9de2:#a78bfa>
    🐱 Commandes Neko n' Yume
    </gradient>

    <gray>/nekoyume claim</gray> - Adopter ton premier chat
    <gray>/nekoyume cat</gray> - Voir ton chat
    <gray>/nekoyume rename &lt;nom&gt;</gray> - Renommer ton chat
    <gray>/nekoyume summon</gray> - Invoquer ton chat
    <gray>/nekoyume mode &lt;follow|sit|free&gt;</gray> - Changer le mode de comportement
    <gray>/nekoyume gui</gray> - Ouvrir le panneau du chat
    <gray>/nekoyume skill</gray> - Ouvrir le panneau des compétences
    <gray>/nekoyume tool</gray> - Recevoir la baguette à chat
    <gray>/nekoyume language &lt;auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es&gt;</gray> - Changer la langue du plugin
    <gray>/nekoyume achievements</gray> - Voir le panthéon des succès
    <gray>/nekoyume help</gray> - Afficher l'aide

  claim:
    already-has: "<red>🐱 Tu as déjà un chat !</red>"
    first-cat: "<gradient:#ff9de2:#a78bfa>🐱 Félicitations ! Voici ton premier chat </gradient>{0} !"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} est arrivé à tes côtés !"

  cat:
    data-error: "<red>🐱 Les données de ton chat sont anormales, contacte un administrateur.</red>"
    header: "<gradient:#ff9de2:#a78bfa>🐱 Ton chat</gradient>"
    name: "Nom : {0}"
    days: "<white>Ensemble : <aqua>{0}ᵉ jour</aqua>"
    level: "<white>Niveau : <yellow>{0}</yellow> <gray>(XP {1}/{2})</gray>"
    meow: "<white>Rang miaou : <light_purple>{0}</light_purple> <gray>(Force miaou {1}/{2})</gray>"
    mood: "<white>Humeur : <yellow>{0} {1}</yellow>"
    personality: "<white>Personnalité : <aqua>{0}</aqua>"
    tier: "<white>Prestige : <aqua>{0}</aqua>"
    behavior: "<white>Comportement : <aqua>{0}</aqua>"
    bond: "<white>Lien : <light_purple>{0}</light_purple> <gray>({1}/100)</gray>"
    combat-bonus: "<white>Bonus de combat : <red>{0}%</red></white>"
    equipment: "<white>Équipement : <gold>{0}</gold></white>"

  mode:
    usage: "<yellow>Usage : /nekoyume mode <follow|sit|free></yellow>"
    unknown: "<red>❌ Mode inconnu : {0}</red>"
    changed: "<gradient:#ff9de2:#a78bfa>🐱 Mode de comportement changé : </gradient>{0}"

  rename:
    usage: "<yellow>Usage : /nekoyume rename <nom></yellow>"
    empty: "<red>❌ Le nom du chat ne peut pas être vide !</red>"
    too-long: "<red>❌ Le nom du chat ne peut pas dépasser 16 caractères !</red>"
    done: "<gradient:#ff9de2:#a78bfa>🐱 Ton chat s'appelle désormais </gradient>{0} !"

  summon:
    spawned: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} est apparu à tes côtés !"
    here: "<gradient:#ff9de2:#a78bfa>🐱 </gradient>{0} t'a rejoint !"

  tool:
    received: "<gradient:#ff9de2:#a78bfa>🐱 Tu as reçu une baguette à chat, clic droit pour l'utiliser !</gradient>"
    inventory-full: "<yellow>🐱 Inventaire plein, la baguette est tombée à tes pieds.</yellow>"

  language:
    usage: "<yellow>Usage : /nekoyume language <auto|zh_cn|zh_tw|en_us|ja_jp|ko_kr|fr_fr|de_de|es_es></yellow>"
    set: "<gradient:#ff9de2:#a78bfa>🐱 Langue du plugin changée : </gradient>{0} !"
    reset: "<gradient:#ff9de2:#a78bfa>🐱 La langue du plugin suit maintenant tes paramètres Minecraft.</gradient>"
    unknown: "<red>❌ Langue inconnue : {0}</red>"

  achievements:
    disabled: "<red>🏆 Le système de succès est désactivé.</red>"

