#
# ---------- Baguette à chat ----------
#
tool:
  already: "<yellow>Tu as déjà une baguette à chat.</yellow>"
  wand-name: "§d🐱 Baguette à chat"
  wand-lore: "§7Clic droit pour ouvrir le panneau du chat"
  claim-title: "§d🎉 Tu as obtenu un chat !"
  claim-subtitle: "§7§oBienvenue dans 猫と夢 · Neko n' Yume"

#
# ---------- Livre du débutant ----------
#
book:
  title: "§d🐱 Guide du débutant 猫と夢"
  author: "Mizuki Chou"
  page-1: "§l§1🐱 Bienvenue dans 猫と夢 !\n\n§r§7Voici un petit monde à toi et ton chat.\n§7Ce petit chat restera toujours à tes côtés."
  page-2: "§l§2🐾 Opérations de base\n\n§r§7Clic droit avec la baguette pour ouvrir le panneau.\n§7Le panneau montre l'état du chat\n§7et permet de passer aux compétences.\n§7S'accroupir près du chat pour le caresser."
  page-3: "§l§3🍖 Nourriture\n\n§r§7Clic droit sur le chat avec de la nourriture.\n§7Nourrir augmente satiété et affection.\n§7Affamé, le chat maigrit —\n§7pense à bien le nourrir."
  page-4: "§l§4💖 Affection\n\n§r§7Caresses et nourriture augmentent l'affection.\n§7L'affection influence l'aura et les cadeaux.\n§7Les 3 premières interactions du jour sont les meilleures."
  page-5: "§l§5📈 Progression\n\n§r§7Les interactions donnent de l'XP.\n§7Nourrir peut rapporter de la force miaou,\n§7qui élève le rang et débloque des emplacements.\n§7En combat, le chat te protège."
  page-6: "§l§6⚔ Combat\n\n§r§7En mode suivi, le chat attaque\n§7les ennemis proches du maître.\n§7Blessé, il se repose 90 secondes\n§7et ne meurt jamais."
  page-7: "§l§8🏆 Succès\n\n§r§7Chaque interaction avec le chat\n§7peut débloquer un succès.\n§7/nekoyume achievements\n§7pour voir le panthéon."
  page-8: "§l§d🌙 Nuit du démon\n\n§r§7Elle peut tomber chaque nuit.\n§7Monstres plus forts,\n§7mais des Dans de miaou à la clé.\n§7🐱 Bonne aventure avec ton chat !"

