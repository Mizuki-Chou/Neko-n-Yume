# 语言（lang/zh_cn.yml 为简体中文；可为其他语言添加 lang/<code>.yml）
language: zh_cn

join-message:
  enabled: true

  messages:
    - "<gradient:#ff9de2:#a78bfa>❤ 猫と夢 - Neko n' Yume</gradient>"
    - "<gradient:#c084fc:#60a5fa>✦ 开发者：Mizuki Chou</gradient>"
    - "<gradient:#60a5fa:#34d399>Github: https://github.com/Mizuki-Chou</gradient>"

# 数据存储与备份
storage:
  backup:
    enabled: true
    keep: 5

# 物品自定义材质
items:
  meowdan:
    generation: 1
    custom-model-data:
      common: 91001
      uncommon: 91002
      rare: 91003
      epic: 91004
      legendary: 91005

# 成长
growth:
  pet-xp-min: 5
  pet-xp-max: 30
  level-curve-base: 100

# 好感
affection:
  feed-base: 15
  pet-base: 3

# 喵力
#
# 0.6.2：概率上调（抚摸 18→25，喂食 8→12）。
meow:
  pet-chance: 25
  feed-chance: 12
  feed-chance-limit: 3
  rank-curve-offset: 19

# 饥饿
hunger:
  base-interval-seconds: 300

# 每日限制
daily:
  pet-limit: 3

# 食物
food:
  values:
    COD: 8
    SALMON: 10
    COOKED_COD: 15
    COOKED_SALMON: 18
    CHICKEN: 10
    COOKED_CHICKEN: 16
    BEEF: 12
    COOKED_BEEF: 20
    PORKCHOP: 12
    COOKED_PORKCHOP: 20
    MUTTON: 12
    COOKED_MUTTON: 18
    RABBIT: 10
    COOKED_RABBIT: 16
    GOLDEN_CARROT: 30
    APPLE: 12
    BREAD: 12
    CAKE: 25

# 礼物事件
#
# 每天登录后判定一次（延迟 3 秒）。
# 概率 = base-chance + chance-per-rank × 喵阶，封顶 max-chance。
# 心情不低于 mood-min 才可能触发。
#
# 档位：每 5 阶一档
#   tier-1 = 喵阶 0~5
#   tier-2 = 喵阶 6~10
#   tier-3 = 喵阶 11~15
#   tier-4 = 喵阶 16~20
#   tier-5 = 喵阶 21+
#
# 条目格式：
#   - material: 物品ID
#     amount: 数量
#     weight: 权重
#   - material: 物品ID
#     min: 1
#     max: 2
#     weight: 30
#   - meowdan: 品质
#     amount: 1
#     weight: 5
#
# 注意：至极（LEGENDARY）喵丹不应出现在礼物池，
# 它只通过合成（9×卓越）获得。

gift:
  enabled: true
  mood-min: CALM
  base-chance: 20
  chance-per-rank: 5
  max-chance: 80
  tiers:
    tier-1: # 喵阶 0~5
      - material: COD
        amount: 1
        weight: 50
      - material: STRING
        amount: 1
        weight: 30
      - material: SALMON
        amount: 1
        weight: 20
      - meowdan: COMMON
        amount: 1
        weight: 5

    tier-2: # 喵阶 6~10
      - material: COOKED_COD
        amount: 1
        weight: 40
      - material: SALMON
        min: 1
        max: 2
        weight: 30
      - material: LEATHER
        amount: 1
        weight: 30
      - meowdan: COMMON
        amount: 1
        weight: 4
      - meowdan: UNCOMMON
        amount: 1
        weight: 2

    tier-3: # 喵阶 11~15
      - material: COOKED_SALMON
        amount: 1
        weight: 40
      - material: GOLD_NUGGET
        amount: 1
        weight: 20
      - material: STRING
        min: 1
        max: 2
        weight: 20
      - material: LAPIS_LAZULI
        amount: 2
        weight: 20
      - meowdan: UNCOMMON
        amount: 1
        weight: 4
      - meowdan: RARE
        amount: 1
        weight: 2

    tier-4: # 喵阶 16~20
      - material: GOLDEN_CARROT
        amount: 1
        weight: 40
      - material: DIAMOND
        amount: 1
        weight: 25
      - material: EMERALD
        amount: 1
        weight: 25
      - material: GOLD_NUGGET
        amount: 3
        weight: 10
      - meowdan: RARE
        amount: 1
        weight: 4
      - meowdan: EPIC
        amount: 1
        weight: 2

    tier-5: # 喵阶 21+
      - material: DIAMOND
        amount: 2
        weight: 40
      - material: EMERALD
        amount: 2
        weight: 30
      - material: ENCHANTED_GOLDEN_APPLE
        amount: 1
        weight: 15
      - material: GOLDEN_CARROT
        amount: 2
        weight: 15
      - meowdan: EPIC
        amount: 1
        weight: 6

# 成就（0.7.0）
#
# 进度持久化于 players.yml（data-version v5），
# 重启不丢进度。
#
# 成就清单（16 个）：
#   相遇即是缘 / 三日之约 / 百日同行
#   摸摸头 / 撸猫大师
#   投喂员 / 干饭王
#   初露锋芒 / 登峰造极
#   喵光初现 / 喵力全开
#   技惊四座 / 刷新狂魔
#   蜕变之日 / 小惊喜 / 护主骑士
#
# 奖励：大部分成就奖励猫咪经验；
# 七个里程碑成就奖励喵力。
# 下方每个成就可覆盖奖励数值：
#   xp          = 经验奖励
#   meow-power  = 喵力奖励
# 未配置的成就使用内置默认值。

achievements:
  enabled: true
  rewards:
    first-claim:
      xp: 50
    companion-days-3:
      xp: 50
    companion-days-100:
      meow-power: 50
    pet-total-10:
      xp: 30
    pet-total-200:
      meow-power: 10
    feed-total-10:
      xp: 30
    feed-total-100:
      meow-power: 10
    level-10:
      xp: 100
    level-60:
      meow-power: 30
    meow-rank-5:
      xp: 100
    meow-rank-30:
      meow-power: 30
    skill-activate-20:
      xp: 100
    skill-refresh-10:
      meow-power: 30
    tier-upgrade-1:
      xp: 150
    gift-1:
      xp: 80
    monster-kill-50:
      meow-power: 5

# 技能
#
# 刷新消耗接口：
#   cost-type: meow-power | player-points
#   默认消耗喵力；接入 PlayerPoints 后
#   消耗其 points（需要安装 PlayerPoints 插件）。
#
# 技能数值覆盖（可选）：
#   skills.values.<技能ID>.<键>
#   键：power / cooldown / duration / radius / amplifier / chance / multiplier

skills:
  refresh:
    cost-type: meow-power
    cost: 10
    dream-slot-cost-multiplier: 3
  values: {}

# 战斗
#
# 猫跟随模式下自动攻击主人附近的敌对生物。
# 猫可受伤但不会死亡：
# 致死时进入受伤恢复期（默认 90 秒，九命固定 20 秒），
# 期间隐身冻结、怪物无视，倒计时结束满血复活。
# 恢复期外残血每 4 秒回复 1 点。

battle:
  enabled: true
  base-damage: 5
  per-rank-damage: 1
  attack-interval-ticks: 40
  aggro-radius: 12
  weakness-seconds: 10
  eternity-rebirth-seconds: 180
  recovery-seconds: 90
  regen-interval-seconds: 4

# 光环
#
# 跟随模式 + 光环范围内，主人获得增益。

aura:
  enabled: true
  base-radius: 10
  speed-unlock-level: 5
  strength-unlock-meow-rank: 2
  regen-unlock-level: 15
  regen-affection: 80

# 梦魔之夜（Muma's Night）
#
# 世界开关：/nyadmin mumanight <on|off>（存于世界 PDC，重启保留）。
# 每夜 chance 概率降临。
# 降临后野外怪物：血量 ×health-multiplier、攻击 ×damage-multiplier、
# 主手随机钻石/下界合金剑（不掉落）；监守者与 Boss 不受影响。
# 被强化的怪物死亡 meowdan-drop-chance 概率掉落喵丹，
# 品质权重：平凡 80 / 精良 16 / 独特 3 / 卓越 1 / 至极 0。

muma-night:
  chance: 0.2
  health-multiplier: 4.0
  damage-multiplier: 2.5
  meowdan-drop-chance: 0.15

