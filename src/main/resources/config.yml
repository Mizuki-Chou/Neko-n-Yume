# 语言（lang/zh_cn.yml 为简体中文；可为其他语言添加 lang/<code>.yml）
language: zh_cn

join-message:
  enabled: true

  messages:
    - "<gradient:#ff9de2:#a78bfa>❤ 猫と夢 - Neko n' Yume</gradient>"
    - "<gradient:#c084fc:#60a5fa>✦ 开发者：Mizuki Chou</gradient>"
    - "<gradient:#60a5fa:#34d399>Github: https://github.com/Mizuki-Chou</gradient>"

# 数据存储与备份
storage:
  backup:
    enabled: true
    keep: 5

# 物品自定义材质
items:
  meowdan:
    generation: 1
    custom-model-data:
      common: 91001
      uncommon: 91002
      rare: 91003
      epic: 91004
      legendary: 91005

# 成长
growth:
  pet-xp-min: 5
  pet-xp-max: 30
  level-curve-base: 100

# 好感
# 好感
#
# 抚摸好感：每次 +pet-base（每日上限 daily.pet-limit 次）。
# 喂食好感已由 0.8.0 care 节接管（care.feed-hungry-affection /
# care.feed-normal-affection），旧的 affection.feed-base 已废弃移除。
affection:
  pet-base: 3

# 喵力
#
# 0.6.2：概率上调（抚摸 18→25，喂食 8→12）。
meow:
  pet-chance: 25
  feed-chance: 12
  feed-chance-limit: 3
  #触发时获得的喵力（0.8.0 数值修正：1→2，平衡刷新费用与被动收入）
  feed-gain: 2
  pet-gain: 2
  rank-curve-offset: 19

# 饥饿
hunger:
  base-interval-seconds: 300

# 每日限制
daily:
  pet-limit: 3

# 食物
food:
  values:
    COD: 8
    SALMON: 10
    COOKED_COD: 15
    COOKED_SALMON: 18
    CHICKEN: 10
    COOKED_CHICKEN: 16
    BEEF: 12
    COOKED_BEEF: 20
    PORKCHOP: 12
    COOKED_PORKCHOP: 20
    MUTTON: 12
    COOKED_MUTTON: 18
    RABBIT: 10
    COOKED_RABBIT: 16
    GOLDEN_CARROT: 30
    APPLE: 12
    BREAD: 12
    CAKE: 25

# 礼物事件
#
# 每天登录后判定一次（延迟 3 秒）。
# 概率 = base-chance + chance-per-rank × 喵阶，封顶 max-chance。
# 心情不低于 mood-min 才可能触发。
#
# 档位：每 5 阶一档
#   tier-1 = 喵阶 0~5
#   tier-2 = 喵阶 6~10
#   tier-3 = 喵阶 11~15
#   tier-4 = 喵阶 16~20
#   tier-5 = 喵阶 21+
#
# 条目格式：
#   - material: 物品ID
#     amount: 数量
#     weight: 权重
#   - material: 物品ID
#     min: 1
#     max: 2
#     weight: 30
#   - meowdan: 品质
#     amount: 1
#     weight: 5
#
# 注意：至极（LEGENDARY）喵丹不应出现在礼物池，
# 它只通过合成（9×卓越）获得。

gift:
  enabled: true
  mood-min: CALM
  base-chance: 20
  chance-per-rank: 5
  max-chance: 80
  tiers:
    tier-1: # 喵阶 0~5
      - material: COD
        amount: 1
        weight: 50
      - material: STRING
        amount: 1
        weight: 30
      - material: SALMON
        amount: 1
        weight: 20
      - meowdan: COMMON
        amount: 1
        weight: 5

    tier-2: # 喵阶 6~10
      - material: COOKED_COD
        amount: 1
        weight: 40
      - material: SALMON
        min: 1
        max: 2
        weight: 30
      - material: LEATHER
        amount: 1
        weight: 30
      - meowdan: COMMON
        amount: 1
        weight: 4
      - meowdan: UNCOMMON
        amount: 1
        weight: 2

    tier-3: # 喵阶 11~15
      - material: COOKED_SALMON
        amount: 1
        weight: 40
      - material: GOLD_NUGGET
        amount: 1
        weight: 20
      - material: STRING
        min: 1
        max: 2
        weight: 20
      - material: LAPIS_LAZULI
        amount: 2
        weight: 20
      - meowdan: UNCOMMON
        amount: 1
        weight: 4
      - meowdan: RARE
        amount: 1
        weight: 2

    tier-4: # 喵阶 16~20
      - material: GOLDEN_CARROT
        amount: 1
        weight: 40
      - material: DIAMOND
        amount: 1
        weight: 25
      - material: EMERALD
        amount: 1
        weight: 25
      - material: GOLD_NUGGET
        amount: 3
        weight: 10
      - meowdan: RARE
        amount: 1
        weight: 4
      - meowdan: EPIC
        amount: 1
        weight: 2

    tier-5: # 喵阶 21+
      - material: DIAMOND
        amount: 2
        weight: 40
      - material: EMERALD
        amount: 2
        weight: 30
      - material: ENCHANTED_GOLDEN_APPLE
        amount: 1
        weight: 15
      - material: GOLDEN_CARROT
        amount: 2
        weight: 15
      - meowdan: EPIC
        amount: 1
        weight: 6

# 成就（0.7.0）
#
# 进度持久化于 players.yml（data-version v5），
# 重启不丢进度。
#
# 成就清单（16 个）：
#   相遇即是缘 / 三日之约 / 百日同行
#   摸摸头 / 撸猫大师
#   投喂员 / 干饭王
#   初露锋芒 / 登峰造极
#   喵光初现 / 喵力全开
#   技惊四座 / 刷新狂魔
#   蜕变之日 / 小惊喜 / 护主骑士
#
# 奖励：大部分成就奖励猫咪经验；
# 七个里程碑成就奖励喵力。
# 下方每个成就可覆盖奖励数值：
#   xp          = 经验奖励
#   meow-power  = 喵力奖励
# 未配置的成就使用内置默认值。

achievements:
  enabled: true
  rewards:
    first-claim:
      xp: 50
    companion-days-3:
      xp: 50
    companion-days-100:
      meow-power: 50
    pet-total-10:
      xp: 30
    pet-total-200:
      meow-power: 10
    feed-total-10:
      xp: 30
    feed-total-100:
      meow-power: 10
    level-10:
      xp: 100
    level-60:
      meow-power: 30
    meow-rank-5:
      xp: 100
    meow-rank-30:
      meow-power: 30
    skill-activate-20:
      xp: 100
    skill-refresh-10:
      meow-power: 30
    tier-upgrade-1:
      xp: 150
    gift-1:
      xp: 80
    monster-kill-50:
      meow-power: 5

# 技能
#
# 刷新消耗接口：
#   cost-type: meow-power | player-points
#   默认消耗喵力；接入 PlayerPoints 后
#   消耗其 points（需要安装 PlayerPoints 插件）。
#
# 技能数值覆盖（可选）：
#   skills.values.<技能ID>.<键>
#   键：power / cooldown / duration / radius / amplifier / chance / multiplier

skills:
  refresh:
    cost-type: meow-power
    cost: 10
    dream-slot-cost-multiplier: 3
  values: {}

# 战斗
#
# 猫跟随模式下自动攻击主人附近的敌对生物。
# 猫可受伤但不会死亡：
# 致死时进入受伤恢复期（默认 90 秒，九命固定 20 秒），
# 期间隐身冻结、怪物无视，倒计时结束满血复活。
# 恢复期外残血每 4 秒回复 1 点。
#
# 注意：battle.enabled 设为 false 时猫会免疫一切伤害
# （致死保护协议随战斗系统整体关闭）。

battle:
  enabled: true
  base-damage: 5
  per-rank-damage: 1
  attack-interval-ticks: 40
  aggro-radius: 12
  weakness-seconds: 10
  eternity-rebirth-seconds: 180
  recovery-seconds: 90
  regen-interval-seconds: 4
  # 猫击杀普通敌对生物时主人猫咪获得的经验（1~3）
  xp-per-kill-min: 1
  xp-per-kill-max: 3
  # 猫击杀末影龙的经验
  dragon-xp: 100
  # 猫击杀凋零的经验（30~50）
  wither-xp-min: 30
  wither-xp-max: 50

# 光环
#
# 跟随模式 + 光环范围内，主人获得增益。

aura:
  enabled: true
  base-radius: 10
  speed-unlock-level: 5
  strength-unlock-meow-rank: 2
  regen-unlock-level: 15
  regen-affection: 80

# 梦魔之夜（Muma's Night）
#
# 世界开关：/nyadmin mumanight <on|off>（存于世界 PDC，重启保留）。
# 每夜 chance 概率降临。
# 降临后野外怪物：血量 ×health-multiplier、攻击 ×damage-multiplier、
# 主手随机钻石/下界合金剑（不掉落）；监守者与 Boss 不受影响。
# 掉落相关配置（喵丹/经验丸/装备袋概率与开关）已迁至下方 drops 节。

muma-night:
  chance: 0.2
  health-multiplier: 4.0
  damage-multiplier: 2.5

# ============================================================
# 掉落（0.8.0）：NekoNYume 物品的怪物掉落
# ============================================================
#
# 分为两套独立配置：
#   general    平时（梦魔夜以外的时间）
#   muma-night 梦魔夜（被强化的怪物）
#
# 每套含：
#   enabled                    是否掉落（总开关）
#   meowdan-chance             喵丹掉落概率（0~1，相对怪物死亡事件）
#   meowdan-quality-weights    五品质权重（平凡→精良→独特→卓越→至极，
#                              相对值，自动按总和归一；0 = 永不掉）
#   xp-pill-chance             初阶经验丸掉落概率（0~1）
#   elite-xp-pill-chance       高阶经验丸掉落概率（0~1）
#   equip-bag-chance           猫猫装备袋掉落概率（0~1）
#
# 平时默认关闭；若开启，默认只掉前三种喵丹且概率低于梦魔夜，
# 后两种喵丹与装备袋默认 0%。
# 梦魔夜默认开启，概率与 0.7.x 旧版一致。

drops:
  general:
    enabled: false
    meowdan-chance: 0.05
    meowdan-quality-weights: [80, 16, 3, 0, 0]
    xp-pill-chance: 0.0
    elite-xp-pill-chance: 0.0
    equip-bag-chance: 0.0
  muma-night:
    enabled: true
    meowdan-chance: 0.15
    meowdan-quality-weights: [80, 16, 3, 1, 0]
    xp-pill-chance: 0.03
    elite-xp-pill-chance: 0.01
    equip-bag-chance: 0.02

# 经验丸（0.7.4）
#
# 右键喂给猫咪的经验补充剂（不影响饱食与好感）：
# 初阶 +normal-xp 经验，高阶 +elite-xp 经验。
# 创造模式使用不消耗。

xp-pill:
  normal-xp: 50
  elite-xp: 100

# ============================================================
# 羁绊纪元（0.8.0）：养护数值（好感/饥饿/心情/羁绊）
# ============================================================
#
# 全部键缺失时使用默认值；非法值钳制/回退默认并告警，不会拒启。
# 所有百分比钳制在 ±100% 内，所有门槛钳制在 0~100 内。
# 门槛设为 -1 表示关闭对应机制。
#
# 战斗伤害倍率 = 1 + 心情加成 + 羁绊加成（最终钳制 0.5~3.0）
# 经验倍率   = 1 + 心情加成 + 羁绊加成
# 技能冷却系数 = 1 - 羁绊减免（下限 0.5）
# 治疗量缩放   = 1 + 心情伤害加成的一半
#
care:
  # 心情 → 战斗伤害加成（%）
  mood-damage-percent:
    ECSTATIC: 15
    HAPPY: 8
    CALM: 0
    LOW: -10
    SAD: -20
  # 心情 → 经验加成（%）
  mood-xp-percent:
    ECSTATIC: 10
    HAPPY: 5
    CALM: 0
    LOW: -10
    SAD: -20
  # 每日好感衰减（按服务器日历日结算一次；贪吃性格 +1，悠闲性格 -1）
  affection-daily-decay: 2
  # 饥饿时（低于 hungry-feed-threshold）喂食的好感
  feed-hungry-affection: 8
  # 非饥饿时喂食的好感
  feed-normal-affection: 2
  # 饥饿低于此值无法使用主动技能（-1 = 关闭）
  hungry-skill-threshold: 20
  # 饥饿低于此值拒绝索敌（-1 = 关闭）
  starving-fight-threshold: 0
  # “饥饿”判定门槛（用于雪中送炭好感）
  hungry-feed-threshold: 20
  # 羁绊档位阈值（严格递增，好感达到阈值即进入对应档位）
  bond-tier-thresholds: [20, 40, 60, 80, 100]
  # 羁绊档位 → 经验加成（%），长度 = 档位数（6）
  bond-xp-percent: [0, 0, 5, 10, 10, 10]
  # 羁绊档位 → 技能冷却减免（%）
  bond-cooldown-percent: [0, 0, 0, 5, 5, 5]
  # 羁绊档位 → 战斗伤害加成（%）
  bond-damage-percent: [0, 0, 0, 0, 0, 10]
  # 战败扣减逻辑健康值（0 = 关闭）
  defeat-health-loss: 10
  # 喂食恢复逻辑健康值
  feed-health-restore: 5
  # 饥饿好感衰减节流间隔（分钟，0 = 关闭；默认 180）
  # 旧版与饥饿 tick 同频（5 分钟一次），日喂两次仍会好感净亏损；
  # 0.8.0 好感承载战力后必须与喂食节奏对齐：
  # 180 分钟下日喂两次维持高好感、弃养约 2~3 天归零。
  hunger-affection-loss-minutes: 180
